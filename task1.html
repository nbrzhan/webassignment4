<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 1 - HTML5 Validation</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="sidebar">

    <div class="sidebar-title">
        Assignment #4
    </div>

    <a href="index.html">Task 0</a>
    <a href="task1.html">Task 1</a>
    <a href="task2.html">Task 2</a>
    <a href="task3.html">Task 3</a>
    <a href="task4.html">Task 4</a>

</nav>

    <main class="container">

        <h1>Task 1 - HTML5 Validation</h1>

        <form>

            <div class="form-group">

                <label for="name">
                    Name:
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    minlength="2"
                    maxlength="50"
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    maxlength="100"
                >

            </div>

            <div class="form-group">

                <label for="message">
                    Message:
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    required
                    minlength="10"
                    maxlength="500"
                ></textarea>

            </div>

            <button type="submit">
                Submit
            </button>

        </form>

    </main>

</body>
</html>
