<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task 2 - Bootstrap Form</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- NAVBAR -->

    <nav class="sidebar">

    <div class="sidebar-title">
        Assignment #4
    </div>

    <a href="index.html">Task 0</a>
    <a href="task1.html">Task 1</a>
    <a href="task2.html">Task 2</a>
    <a href="task3.html">Task 3</a>
    <a href="task4.html">Task 4</a>

</nav>


    <!-- MAIN CONTENT -->

    <div class="container mt-5">

        <h1 class="mb-4">
            Task 2 - Bootstrap Contact Form
        </h1>

        <form>

            <div class="row">

                <!-- NAME -->

                <div class="col-md-6 mb-3">

                    <label
                        for="name"
                        class="form-label"
                    >
                        Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <div class="form-text">
                        Please enter your full name.
                    </div>

                </div>


                <!-- EMAIL -->

                <div class="col-md-6 mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="name@example.com"
                    >

                    <div class="form-text">
                        We'll never share your email.
                    </div>

                </div>

            </div>


            <!-- MESSAGE -->

            <div class="mb-3">

                <label
                    for="message"
                    class="form-label"
                >
                    Message
                </label>

                <textarea
                    class="form-control"
                    id="message"
                    rows="5"
                    placeholder="Write your message here..."
                ></textarea>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="btn btn-primary"
            >
                Submit
            </button>

        </form>

    </div>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
