    <main class="container">

        <h1>Task 0 - Simple Contact Form</h1>

        <form>

            <div class="form-group">
                <label for="name">Name:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                >
            </div>

            <div class="form-group">
                <label for="message">Message:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                ></textarea>
            </div>

            <button type="submit">
                Submit
            </button>

        </form>

    </main>

</body>
