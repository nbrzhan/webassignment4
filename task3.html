<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task 3 - Bootstrap Validation</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- NAVBAR -->

    <nav class="sidebar">

    <div class="sidebar-title">
        Assignment #4
    </div>

    <a href="index.html">Task 0</a>
    <a href="task1.html">Task 1</a>
    <a href="task2.html">Task 2</a>
    <a href="task3.html">Task 3</a>
    <a href="task4.html">Task 4</a>

</nav>


    <!-- CONTENT -->

    <div class="container mt-5">

        <h1 class="mb-4">
            Task 3 - Bootstrap Validation
        </h1>

        <form>

            <!-- VALID NAME -->

            <div class="mb-4">

                <label
                    for="validName"
                    class="form-label"
                >
                    Name
                </label>

                <input
                    type="text"
                    class="form-control is-valid"
                    id="validName"
                    value="John"
                    required
                >

                <div class="valid-feedback">
                    Looks good!
                </div>

            </div>


            <!-- INVALID EMAIL -->

            <div class="mb-4">

                <label
                    for="invalidEmail"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    class="form-control is-invalid"
                    id="invalidEmail"
                    required
                >

                <div class="invalid-feedback">
                    Email is required.
                </div>

            </div>


            <!-- MESSAGE -->

            <div class="mb-4">

                <label
                    for="message"
                    class="form-label"
                >
                    Message
                </label>

                <textarea
                    class="form-control is-valid"
                    id="message"
                    rows="4"
                    required
                >This is my message.</textarea>

                <div class="valid-feedback">
                    Looks good!
                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Submit
            </button>

        </form>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
